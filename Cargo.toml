[package]
name = "miniscop"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/KingRocco21/Miniscop"
license = "AGPL-3"


[dependencies]
# Both client and server
quinn = "0.11"
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
bitcode = "0.6"
# Client
bevy = { version = "0.16", features = ["bevy_dev_tools"] }
bevy_asset_loader = { version = "0.23.0", features = ["2d"] }
bevy_sprite3d = "6.0"
avian3d = { version = "0.3", features = ["serialize"] }
bevy-tnua = "0.24"
bevy-tnua-avian3d = "0.5"
leafwing-input-manager = "0.17"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
unicode-segmentation = "1.12"
# Server
clap = { version = "4.5", features = ["derive"] }
rustls-pki-types = "1.12"



# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
